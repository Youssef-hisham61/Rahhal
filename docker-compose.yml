version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rahhal_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rahhal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rahhal_backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - rahhal-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rahhal_frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - rahhal-network
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: rahhal_nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rahhal-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  rahhal-network:
    driver: bridge
