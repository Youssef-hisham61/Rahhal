version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rahhal-network
    restart: unless-stopped

  backend:
    build: ./backend
    volumes:
      - ./backend/src:/app/src
    networks:
      - rahhal-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - rahhal-network
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rahhal-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  rahhal-network:
    driver: bridge
